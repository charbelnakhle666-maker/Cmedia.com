!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Work with CMedia</title>
<style>
:root{--bg:#fff;--fg:#08264b;--mut:#49627e;--line:#d6e4f2;--soft:#f4f8fc;--navy:#08264b;--blue:#1c5b9a;--teal:#1c5b9a;--orange:#c9a45c}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-weight:300}
b,strong{font-weight:600}
.stage{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:12px}
.phone{position:relative;width:min(360px,92vw);height:min(700px,calc(100vh - 80px));min-height:500px;border-radius:34px;border:1px solid var(--line);background:#fff;overflow:hidden;box-shadow:0 0 0 6px #f4f8fc,0 30px 80px rgba(8,38,75,.16)}
.ig{padding:20px 16px;transition:filter .8s,opacity .8s}
.top{display:flex;align-items:center;gap:6px;font-weight:600;font-size:16px;margin-bottom:16px}
.pro{display:flex;align-items:center;gap:18px;position:relative}
.ring{width:84px;height:84px;border-radius:50%;padding:3px;flex:none;background:linear-gradient(45deg,var(--orange),var(--teal),var(--blue),var(--navy))}
.ring div{width:100%;height:100%;border-radius:50%;border:3px solid #fff;background:var(--soft);color:var(--navy);display:grid;place-items:center;font-weight:300;font-size:22px;letter-spacing:1px}
.stats{display:flex;flex:1;justify-content:space-between;text-align:center}
.stats b{display:block;font-size:17px;font-variant-numeric:tabular-nums}
.stats span{font-size:12px;color:var(--mut)}
#fol{transition:text-shadow .4s,color .4s}
#fol.surge{color:var(--blue);text-shadow:0 0 14px rgba(28,91,154,.55)}
.gain{position:absolute;right:30px;top:-8px;font-size:13px;font-weight:600;color:var(--orange);opacity:0}
.gain.on{animation:rise 1.8s ease-out forwards}
@keyframes rise{0%{opacity:0;transform:translateY(14px)}20%{opacity:1}100%{opacity:0;transform:translateY(-26px)}}
.bio{margin:14px 0 12px;font-size:13px;line-height:1.4}
.bio small{display:block;color:var(--mut)}
.btns{display:flex;gap:6px;margin-bottom:14px}
.btns i{flex:1;text-align:center;font-style:normal;font-size:13px;font-weight:600;padding:7px 0;border-radius:8px;background:var(--soft);color:var(--fg)}
.btns i:first-child{background:var(--blue);color:#fff}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px}
.tile{aspect-ratio:1;position:relative;overflow:hidden}
.tile::before{content:"";position:absolute;width:46%;height:46%;left:27%;top:27%;border-radius:50%;background:rgba(255,255,255,.2)}
.lk{position:absolute;left:5px;bottom:4px;font-size:11px;font-weight:600;color:#fff;opacity:0;transform:translateY(6px);transition:.5s;text-shadow:0 1px 4px rgba(0,0,0,.45)}
.lk.on{opacity:1;transform:none}
.ov{position:absolute;inset:0;display:grid;place-items:center;background:rgba(255,255,255,.74);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);opacity:0;pointer-events:none;transition:opacity .35s}
.ov.on{opacity:1}
.modal{width:78%;padding:24px 20px 20px;border-radius:22px;background:#fff;border:1px solid var(--line);box-shadow:0 24px 60px rgba(8,38,75,.2);text-align:center;transform:scale(.9);transition:transform .45s cubic-bezier(.2,1.2,.3,1)}
.ov.on .modal{transform:none}
.logo{display:block;background:#fff;object-fit:contain}
.logo.m{width:116px;height:116px;margin:0 auto 10px;border-radius:24px}
.logo.e{width:min(230px,64%);aspect-ratio:1;height:auto;border-radius:34px;margin-bottom:14px;box-shadow:0 0 0 1px var(--line),0 24px 60px rgba(28,91,154,.28)}
.modal h2{margin:0 0 6px;font-size:22px;font-weight:300;color:var(--navy)}
.modal p{margin:0 0 20px;font-size:13px;color:var(--mut)}
#yes{position:relative;width:100%;border:0;border-radius:12px;padding:13px;font-family:inherit;font-size:16px;font-weight:600;color:#fff;background:var(--blue);transition:transform .15s,filter .15s}
#yes::after{content:"";position:absolute;inset:0;border-radius:12px;border:2px solid var(--blue);animation:ping 1.2s infinite}
#yes.press{transform:scale(.93);filter:brightness(1.2)}
@keyframes ping{from{opacity:.9;transform:scale(1)}to{opacity:0;transform:scale(1.18,1.4)}}
.cur{position:absolute;left:0;top:0;width:26px;height:26px;opacity:0;pointer-events:none;z-index:5;margin:-4px 0 0 -6px;filter:drop-shadow(0 2px 3px rgba(0,0,0,.3))}
.feed{position:absolute;left:12px;right:12px;bottom:14px;top:34%;display:flex;flex-direction:column;justify-content:flex-end;gap:8px;overflow:hidden;pointer-events:none;-webkit-mask-image:linear-gradient(to bottom,transparent,#000 40%);mask-image:linear-gradient(to bottom,transparent,#000 40%)}
.note{flex:none;display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:16px;background:rgba(255,255,255,.97);border:1px solid var(--line);box-shadow:0 8px 22px rgba(8,38,75,.1);animation:in .5s cubic-bezier(.2,.9,.3,1.2) both}
.note.key{padding:13px 14px;border-color:var(--teal);box-shadow:0 8px 28px rgba(28,91,154,.3)}
.av{width:34px;height:34px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:13px;font-weight:600;color:#fff;background:var(--c)}
.key .av{width:40px;height:40px}
.note b{display:block;font-size:13px;font-weight:400}
.key b{font-size:15px;font-weight:600;color:var(--navy)}
.note span{font-size:11.5px;color:var(--mut)}
@keyframes in{from{opacity:0;transform:translateY(26px) scale(.95)}to{opacity:1;transform:none}}
.end{position:absolute;inset:0;display:grid;place-content:center;justify-items:center;text-align:center;gap:6px;background:radial-gradient(circle at 50% 40%,rgba(28,91,154,.2),rgba(201,164,92,.08) 48%,#fff 74%);opacity:0;pointer-events:none;transition:opacity .9s}
.end p{margin:0;font-size:18px;font-weight:300;color:var(--navy)}
.end small{color:var(--mut);font-size:13px;margin-top:10px}
.done .end{opacity:1}
.done .ig,.done .feed{filter:blur(8px);opacity:.25}
.ctl{display:flex;align-items:center;gap:12px;width:min(360px,92vw)}
.bar{flex:1;height:3px;border-radius:2px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--teal),var(--blue),var(--orange))}
@keyframes fill{to{width:100%}}
#replay{border:1px solid var(--line);background:#fff;color:var(--navy);border-radius:999px;padding:7px 14px;font-family:inherit;font-size:13px;font-weight:400;cursor:pointer}
#replay:hover,#replay:focus-visible{background:var(--soft);outline:2px solid var(--blue)}
@media (prefers-reduced-motion:reduce){#yes::after,.gain.on{animation:none}}
</style>
</head>

<script>
(function(){
var $=function(s){return document.querySelector(s)};
var sleep=function(ms){return new Promise(function(r){setTimeout(r,ms)})};
var P=$('#phone'),fol=$('#fol'),ov=$('#ov'),yes=$('#yes'),cur=$('#cur'),feed=$('#feed'),prog=$('#prog'),gain=$('#gain'),grid=$('#grid');
var run=0,anonN=0,anon=['@anonimous one','@anonimous two','@anonimous three','@anonimous four'];
var reduceMotion=window.matchMedia('(prefers-reduced-motion: reduce)').matches;

/* Post grid */
var tiles=[['#1c5b9a','#08264b','2.1K'],['#c9a45c','#c9a45c','2.3K'],['#1c5b9a','#08264b','3.4K'],['#b9dcff','#1c5b9a','2.7K'],['#d3ad62','#c9a45c','4.2K'],['#08264b','#1c5b9a','2.4K'],['#1c5b9a','#08264b','4.8K'],['#d3ad62','#1c5b9a','2.9K'],['#1c5b9a','#08264b','3.8K']];
tiles.forEach(function(t){
  var d=document.createElement('div');d.className='tile';
  d.style.background='linear-gradient(135deg,'+t[0]+','+t[1]+')';
  d.innerHTML='<span class="lk">♥ '+t[2]+'</span>';
  grid.appendChild(d);
});

var keyNotes=[['Who is this Marketing Agency?','#1c5b9a'],['What a piece of art!','#c9a45c'],['How can I make it happen?','#1c5b9a']];
var extras=['Started following you','Can we collaborate? 💬','Liked your post ❤️','Just sent you a message','Started following you','Mentioned you in a story'];
var colors=['#08264b','#1c5b9a','#c9a45c','#1c5b9a','#1c5b9a','#c9a45c'];

function note(text,color,key){
  var who=anon[anonN++%anon.length];
  var n=document.createElement('div');n.className='note'+(key?' key':'');
  n.innerHTML='<div class="av" style="--c:'+color+'">'+who.charAt(1).toUpperCase()+'</div><div><b></b><span>'+who+' · now</span></div>';
  n.querySelector('b').textContent=text;
  feed.appendChild(n);
  while(feed.children.length>6)feed.removeChild(feed.firstChild);
}

function count(from,to,ms,ok){
  return new Promise(function(res){
    var t0=performance.now();
    (function f(t){
      var p=Math.min(1,(t-t0)/ms),e=p<.5?4*p*p*p:1-Math.pow(-2*p+2,3)/2;
      fol.textContent=Math.round(from+(to-from)*e).toLocaleString('en-US');
      if(p<1&&ok())requestAnimationFrame(f);else res();
    })(t0);
  });
}

function reset(){
  anonN=0;
  fol.textContent='500';fol.classList.remove('surge');gain.classList.remove('on');
  ov.classList.remove('on');yes.classList.remove('press');feed.innerHTML='';P.classList.remove('done');
  document.querySelectorAll('.lk').forEach(function(e){e.classList.remove('on')});
  cur.style.transition='none';cur.style.opacity=0;
  cur.style.transform='translate('+P.offsetWidth*.85+'px,'+P.offsetHeight*.9+'px)';
  prog.style.animation='none';void prog.offsetWidth;
}

async function play(){
  if(reduceMotion){
    fol.textContent='60,000';
    P.classList.add('done');
    return;
  }
  var id=++run,ok=function(){return id===run};
  reset();
  prog.style.animation='fill 16s linear forwards';
  await sleep(1800);if(!ok())return;
  ov.classList.add('on');
  await sleep(1300);if(!ok())return;
  var pr=P.getBoundingClientRect(),br=yes.getBoundingClientRect();
  cur.style.opacity=1;void cur.offsetWidth;
  cur.style.transition='transform .9s cubic-bezier(.4,0,.2,1),opacity .3s';
  cur.style.transform='translate('+(br.left-pr.left+br.width*.6)+'px,'+(br.top-pr.top+br.height*.55)+'px)';
  await sleep(1100);if(!ok())return;
  yes.classList.add('press');
  await sleep(220);if(!ok())return;
  ov.classList.remove('on');cur.style.opacity=0;
  await sleep(350);if(!ok())return;
  fol.classList.add('surge');gain.classList.add('on');
  var c=count(500,60000,2600,ok);
  await sleep(1800);if(!ok())return;
  document.querySelectorAll('.lk').forEach(function(e,i){setTimeout(function(){if(ok())e.classList.add('on')},i*90)});
  await c;if(!ok())return;
  await sleep(300);if(!ok())return;
  for(var i=0;i<keyNotes.length;i++){
    note(keyNotes[i][0],keyNotes[i][1],true);
    await sleep(1000);if(!ok())return;
  }
  for(var j=0;j<extras.length;j++){
    note(extras[j],colors[j%colors.length],false);
    await sleep(430);if(!ok())return;
  }
  await sleep(1100);if(!ok())return;
  P.classList.add('done');
}

$('#replay').addEventListener('click',play);

/* Start when the animation scrolls into view (or immediately if unsupported) */
var started=false;
if(reduceMotion){
  fol.textContent='60,000';
  P.classList.add('done');
}else if('IntersectionObserver' in window){
  new IntersectionObserver(function(es,o){
    if(!started&&es[0].isIntersecting){started=true;o.disconnect();play();}
  },{threshold:.4}).observe(P);
}else{play();}
})();
</script>
